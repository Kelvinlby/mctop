name: Package

# Every push, so there is always a .deb to hand for the current branch.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch that is pushed twice in quick succession only needs the newer build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive

jobs:
  deb:
    name: Build and verify the .deb
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A prebuilt binary; building cargo-deb from source costs a minute or two.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build
        id: package
        run: |
          cargo deb
          path=$(ls target/debian/*.deb)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          dpkg-deb -I "$path"

      # The maintainer scripts are shell, so `cargo test` cannot reach them, and
      # they run as root on other people's machines. Installing the package here
      # and walking it through the whole debconf conversation is the only thing
      # standing between a typo and a broken sudoers file on a live server.
      - name: Install, reconfigure, purge
        run: |
          set -x
          deb='${{ github.workspace }}/${{ steps.package.outputs.path }}'
          sudo -E apt-get update
          sudo -E apt-get install -y "$deb"

          # Installs to /usr/bin, and declines the rule unless asked.
          test -x /usr/bin/mctop
          mctop --version
          test ! -e /etc/sudoers.d/mctop

          # Asking for the rule writes one, valid and locked down.
          printf 'mctop mctop/install-sudoers boolean true\n%s\n%s\n' \
            'mctop mctop/server-user string minecraft' \
            'mctop mctop/admin-user string %mctop-admins' | sudo debconf-set-selections
          sudo -E dpkg-reconfigure -f noninteractive mctop
          sudo cat /etc/sudoers.d/mctop
          # By name: a bare `visudo -c` audits all of /etc/sudoers.d, and the
          # runner image ships its own file with permissions sudo dislikes.
          sudo visudo -c -f /etc/sudoers.d/mctop
          test "$(sudo stat -c '%a %U:%G' /etc/sudoers.d/mctop)" = '440 root:root'
          sudo grep -q '^%mctop-admins ALL=(minecraft) NOPASSWD:.*jstat.*jcmd$' /etc/sudoers.d/mctop
          sudo -n true

          # Changing your mind takes the rule away again.
          echo 'mctop mctop/install-sudoers boolean false' | sudo debconf-set-selections
          sudo -E dpkg-reconfigure -f noninteractive mctop
          test ! -e /etc/sudoers.d/mctop

          # Purging leaves nothing behind: no binary, no rule, no answers.
          echo 'mctop mctop/install-sudoers boolean true' | sudo debconf-set-selections
          sudo -E dpkg-reconfigure -f noninteractive mctop
          sudo -E apt-get purge -y mctop
          test ! -e /usr/bin/mctop
          test ! -e /etc/sudoers.d/mctop
          ! sudo debconf-show mctop 2>/dev/null | grep -q install-sudoers
          sudo -n true

      - uses: actions/upload-artifact@v7
        with:
          # Short: this becomes the name of the zip you download. The .deb
          # inside keeps its full versioned name.
          name: mctop-deb-${{ steps.package.outputs.sha }}
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 7
